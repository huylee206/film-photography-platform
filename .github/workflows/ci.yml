name: SOA Microservices CI & Jira Governance

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  repo-and-jira-check:
    name: Security & Jira FPDP Governance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block committed .env secrets
        run: |
          if git ls-files | grep -E '^\.env$|\.env\.local$'; then
            echo "ERROR: Secret .env file detected in repository!"
            exit 1
          fi

      - name: Verify Jira FPDP Issue Key in PR Title or Branch
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! echo "$PR_TITLE $HEAD_REF" | grep -Eq 'FPDP-[0-9]+'; then
            echo "WARNING: PR title or branch name should include Jira key FPDP-<number> for Atlassian auto-linking."
          fi

  build-microservices:
    name: Build & Typecheck 3 Node Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity-service, catalog-booking-service, community-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          npm install
          npm run typecheck
          npm run build

  check-ai-and-gateway:
    name: Validate AI FastAPI & Nginx API Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check AI Service Syntax
        run: python -m py_compile ai-service/app/main.py
      - name: Validate Nginx Gateway Config
        run: |
          docker run --rm -v "$PWD/api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  build-web:
    name: Typecheck & Build Web Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Web
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm run build
