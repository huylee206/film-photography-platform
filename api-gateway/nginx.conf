upstream identity_upstream {
    server identity-service:4001;
}

upstream catalog_booking_upstream {
    server catalog-booking-service:4002;
}

upstream community_upstream {
    server community-service:4003;
}

upstream ai_upstream {
    server ai-service:8000;
}

server {
    listen 80;
    server_name localhost;

    # Common proxy headers for SOA traceability
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Gateway-Version "1.0.0";

    # CORS preflight handling
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # Gateway health & service registry summary
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx-api-gateway","architecture":"SOA-Microservices","services":["identity-service:4001","catalog-booking-service:4002","community-service:4003","ai-service:8000"]}';
    }

    # 1. Identity & Access Management Service
    location /api/v1/auth {
        proxy_pass http://identity_upstream;
    }
    location /api/v1/users {
        proxy_pass http://identity_upstream;
    }

    # 2. Catalog, Atomic Booking, QR Session & Payment Service
    location /api/v1/spaces {
        proxy_pass http://catalog_booking_upstream;
    }
    location /api/v1/resources {
        proxy_pass http://catalog_booking_upstream;
    }
    location /api/v1/bookings {
        proxy_pass http://catalog_booking_upstream;
    }
    location /api/v1/packages {
        proxy_pass http://catalog_booking_upstream;
    }
    location /api/v1/sessions {
        proxy_pass http://catalog_booking_upstream;
    }
    location /api/v1/payments {
        proxy_pass http://catalog_booking_upstream;
    }

    # 3. Community, Reviews, Workshops & Dashboard Service
    location /api/v1/community {
        proxy_pass http://community_upstream;
    }
    location /api/v1/reviews {
        proxy_pass http://community_upstream;
    }
    location /api/v1/workshops {
        proxy_pass http://community_upstream;
    }
    location /api/v1/notifications {
        proxy_pass http://community_upstream;
    }
    location /api/v1/dashboard {
        proxy_pass http://community_upstream;
    }

    # 4. AI & Semantic Intelligence Service (FastAPI)
    location /api/v1/ai {
        proxy_pass http://ai_upstream;
    }
}
