events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Endpoint kiểm tra API Gateway hoạt động
        location /health {
            default_type application/json;
            return 200 '{"status": "UP", "service": "FPDP API Gateway"}';
        }

        # --- Các tuyến điều hướng Microservices (Bỏ chú thích khi hoàn thiện từng service) ---
        # location /api/v1/auth/ { proxy_pass http://identity-service:8081/; }
        # location /api/v1/catalog/ { proxy_pass http://catalog-resource-service:8082/; }
        # location /api/v1/bookings/ { proxy_pass http://booking-session-service:8083/; }
        # location /api/v1/community/ { proxy_pass http://community-service:8084/; }
        # location /api/v1/ai/ { proxy_pass http://ai-assistant-service:8000/; }
    }
}